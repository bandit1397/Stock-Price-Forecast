# 급부상 산업 탐색 대상 (ETF가 산업 자금 흐름의 대리 지표)
themes:
  ai_semis: {name: AI 반도체, etf: SOXX, news: "AI semiconductor demand"}
  ai_power: {name: AI 전력·냉각, etf: PAVE, news: "data center power cooling demand"}
  robotics: {name: 로봇·자동화, etf: BOTZ, news: "humanoid robot automation orders"}
  defense: {name: 방산·우주, etf: ITA, news: "defense spending space contract"}
  cyber: {name: 사이버보안, etf: CIBR, news: "cybersecurity spending breach"}
  biotech: {name: 바이오·신약, etf: XBI, news: "FDA approval biotech"}
  software: {name: 소프트웨어·플랫폼, etf: IGV, news: "enterprise software AI spending"}
  nuclear: {name: 원자력·전력, etf: URA, news: "nuclear power deal uranium"}
  solar: {name: 태양광, etf: TAN, news: "solar policy tariff demand"}
  oil_gas: {name: 석유·가스, etf: XLE, news: "oil price OPEC supply"}
  copper: {name: 구리, etf: COPX, news: "copper supply deficit"}
  gold: {name: 금, etf: GDX, news: "gold price central bank buying"}
  lithium: {name: 리튬·배터리, etf: LIT, news: "lithium price battery demand"}
  steel: {name: 철강·금속, etf: XME, news: "steel tariff prices"}

benchmarks: {KR: "^KS11", KRQ: "^KQ11", US: "^GSPC"}
market_series: ["^GSPC", "^IXIC", "^KS11", "^KQ11", "^VIX", "^TNX", "DX-Y.NYB", "KRW=X", "CL=F", "NG=F", "GC=F", "HG=F", "SI=F"]
fred_series: {DGS10: 미국 10년 금리, DGS2: 미국 2년 금리, T10Y2Y: 장단기 금리차, BAMLH0A0HYM2: 하이일드 스프레드, FEDFUNDS: 기준금리, CPIAUCSL: 소비자물가, UNRATE: 실업률}
